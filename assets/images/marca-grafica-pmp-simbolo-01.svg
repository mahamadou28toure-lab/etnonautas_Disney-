<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="100%" height="100%">
  <!-- Outer Pink Airplane Window Frame (#EC4689) -->
  <rect
    x="84"
    y="54"
    width="432"
    height="572"
    rx="176"
    ry="176"
    fill="#FFFFFF"
    stroke="#EC4689"
    stroke-width="20"
  />

  <!-- Inner Royal Blue Airplane Window Frame (#233975) -->
  <rect
    x="126"
    y="96"
    width="348"
    height="488"
    rx="138"
    ry="138"
    fill="none"
    stroke="#233975"
    stroke-width="11"
  />

  <!-- Three 4-Pointed Royal Blue Stars (#233975) -->
  <!-- Top Star -->
  <path
    d="M 331 142 Q 331 164 353 164 Q 331 164 331 186 Q 331 164 309 164 Q 331 164 331 142 Z"
    fill="#233975"
    stroke="#233975"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Middle-Left Star -->
  <path
    d="M 284 205 Q 284 227 306 227 Q 284 227 284 249 Q 284 227 262 227 Q 284 227 284 205 Z"
    fill="#233975"
    stroke="#233975"
    stroke-width="3"
    stroke-linejoin="round"
  />
  <!-- Right Star -->
  <path
    d="M 434 222 Q 434 244 456 244 Q 434 244 434 266 Q 434 244 412 244 Q 434 244 434 222 Z"
    fill="#233975"
    stroke="#233975"
    stroke-width="3"
    stroke-linejoin="round"
  />

  <!-- Pink Line-Art: Eiffel Tower & Disneyland Castle (#EC4689) -->
  <g
    fill="none"
    stroke="#EC4689"
    stroke-width="9"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <!-- EIFFEL TOWER (Left) -->
    <!-- Antenna -->
    <line x1="205" y1="202" x2="205" y2="220" />
    <!-- Top Cupola -->
    <path d="M 191 241 C 191 218, 219 218, 219 241" />
    <line x1="188" y1="241" x2="222" y2="241" />
    <!-- Upper Tower Shaft -->
    <path d="M 193 241 Q 187 315 173 386" />
    <path d="M 217 241 Q 223 315 237 386" />
    <!-- Middle Platform Bar -->
    <line x1="168" y1="386" x2="242" y2="386" />
    <!-- Lower Outer Legs -->
    <path d="M 173 386 Q 158 455 133 512" />
    <path d="M 237 386 Q 251 455 270 524" />
    <!-- Inner Triangle Cutout -->
    <polygon points="205,408 181,482 229,482" />
    <!-- Bottom Arch -->
    <path d="M 157 528 C 157 480, 253 480, 253 528" />

    <!-- DISNEYLAND CASTLE (Right) -->
    <!-- Left Turret -->
    <path d="M 254 440 Q 274 405 284 358 Q 294 405 314 440 Z" />
    <line x1="251" y1="440" x2="317" y2="440" />
    <line x1="260" y1="440" x2="260" y2="528" />
    <line x1="308" y1="440" x2="308" y2="462" />

    <!-- Mid-Left Back Turret -->
    <polygon points="304,332 348,332 333,292 319,292" />
    <line x1="300" y1="332" x2="352" y2="332" />
    <line x1="309" y1="332" x2="309" y2="414" />
    <line x1="343" y1="332" x2="343" y2="368" />

    <!-- Tall Main Spire -->
    <path d="M 358 206 Q 373 168 380 124 Q 387 168 402 206 Z" />
    <line x1="355" y1="206" x2="405" y2="206" />
    <line x1="364" y1="206" x2="364" y2="270" />
    <line x1="396" y1="206" x2="396" y2="270" />
    <polygon points="355,270 405,270 411,286 349,286" />
    <line x1="355" y1="286" x2="355" y2="362" />
    <line x1="405" y1="286" x2="405" y2="396" />

    <!-- Center Gatehouse -->
    <path d="M 326 412 L 352 360 L 372 360 L 398 412" />
    <line x1="324" y1="412" x2="349" y2="412" />
    <line x1="375" y1="412" x2="400" y2="412" />
    <ellipse cx="362" cy="399" rx="9" ry="13.5" />
    <line x1="330" y1="412" x2="330" y2="454" />
    <line x1="394" y1="412" x2="394" y2="454" />
    <!-- Outer & Inner Gothic Arch -->
    <path d="M 312 528 C 312 474, 333 442, 362 426 C 391 442, 412 474, 412 528" />
    <path d="M 331 528 C 331 486, 346 462, 362 448 C 378 462, 393 486, 393 528" />

    <!-- Right Turret -->
    <path d="M 402 438 Q 421 403 430 358 Q 439 403 458 438 Z" />
    <line x1="399" y1="438" x2="461" y2="438" />
    <line x1="406" y1="438" x2="406" y2="462" />
    <line x1="450" y1="438" x2="450" y2="528" />
  </g>

  <!-- Royal Blue Ground Baseline & Window Sill Line (#233975) -->
  <line
    x1="142"
    y1="529"
    x2="458"
    y2="529"
    stroke="#233975"
    stroke-width="11"
    stroke-linecap="round"
  />
  <line
    x1="242"
    y1="556"
    x2="358"
    y2="556"
    stroke="#233975"
    stroke-width="11"
    stroke-linecap="round"
  />
</svg>
