    <line x1="327" y1="169" x2="327" y2="183" />
    <path d="M 317 198 C 317 182, 337 182, 337 198" />
    <line x1="315" y1="198" x2="339" y2="198" />
    <path d="M 318 198 Q 314 250 304 297" />
    <path d="M 336 198 Q 340 250 350 297" />
    <line x1="301" y1="297" x2="353" y2="297" />
    <path d="M 304 297 Q 293 346 275 385" />
    <path d="M 350 297 Q 360 346 373 394" />
    <polygon points="327,312 310,364 344,364" />
    <path d="M 293 396 C 293 363, 361 363, 361 396" />

    <!-- DISNEYLAND CASTLE (Right) -->
    <!-- Left Turret -->
    <path d="M 365 336 Q 380 312 387 278 Q 394 312 409 336 Z" />
    <line x1="363" y1="336" x2="411" y2="336" />
    <line x1="370" y1="336" x2="370" y2="396" />
    <line x1="404" y1="336" x2="404" y2="350" />

    <!-- Mid-Left Back Turret -->
    <polygon points="402,258 434,258 423,229 413,229" />
    <line x1="399" y1="258" x2="436" y2="258" />
    <line x1="405" y1="258" x2="405" y2="318" />
    <line x1="431" y1="258" x2="431" y2="284" />

    <!-- Tall Main Spire -->
    <path d="M 445 170 Q 455 144 460 116 Q 465 144 475 170 Z" />
    <line x1="443" y1="170" x2="477" y2="170" />
    <line x1="448" y1="170" x2="448" y2="215" />
    <line x1="472" y1="170" x2="472" y2="215" />
    <polygon points="442,215 478,215 482,227 438,227" />
    <line x1="442" y1="227" x2="442" y2="280" />
    <line x1="478" y1="227" x2="478" y2="304" />

    <!-- Center Gatehouse -->
    <path d="M 418 315 L 439 278 L 453 278 L 474 315" />
    <line x1="418" y1="315" x2="435" y2="315" />
    <line x1="457" y1="315" x2="474" y2="315" />
    <ellipse cx="446" cy="306" rx="6.5" ry="9.5" />
    <line x1="421" y1="315" x2="421" y2="345" />
    <!-- Outer & Inner Gothic Arch -->
    <path d="M 408 396 C 408 358, 424 336, 446 325 C 468 336, 484 358, 484 396" />
    <path d="M 422 396 C 422 366, 434 350, 446 340 C 458 350, 470 366, 470 396" />

