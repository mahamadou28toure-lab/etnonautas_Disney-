<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- White background matching Marca gráfica PMP-01.png -->
  <rect width="800" height="800" rx="44" fill="#FFFFFF" />

  <!-- Outer Pink Airplane Window Frame (#EC4689) -->
  <rect
    x="236"
    y="72"
    width="328"
    height="392"
    rx="132"
    ry="132"
    fill="#FFFFFF"
    stroke="#EC4689"
    stroke-width="14"
  />

  <!-- Inner Royal Blue Airplane Window Frame (#233975) -->
  <rect
    x="266"
    y="102"
    width="268"
    height="332"
    rx="102"
    ry="102"
    fill="none"
    stroke="#233975"
    stroke-width="7.5"
  />

  <!-- Three 4-Pointed Royal Blue Stars (#233975) -->
  <!-- Top Star -->
  <path
    d="M 422 128 Q 422 144 438 144 Q 422 144 422 160 Q 422 144 406 144 Q 422 144 422 128 Z"
    fill="#233975"
    stroke="#233975"
