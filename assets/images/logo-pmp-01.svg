    <path d="M 318 614 C 316 578, 320 532, 328 532 C 336 532, 346 578, 355 604 C 365 576, 377 532, 385 532 C 392 532, 396 578, 395 614" stroke-width="12" />
    <!-- A -->
    <path d="M 410 614 C 419 584, 430 555, 440 555 C 448 555, 453 585, 457 614" stroke-width="10.5" />
    <path d="M 417 594 L 454 589" stroke-width="9.5" />
    <!-- G -->
    <path d="M 505 563 C 490 554, 471 568, 471 589 C 471 608, 488 617, 504 607 L 506 589 L 491 589" stroke-width="10.5" />
    <!-- I -->
    <path d="M 526 572 L 523 612" stroke-width="10.5" />
    <ellipse cx="528" cy="552" rx="7.5" ry="5.5" fill="#233975" stroke="none" transform="rotate(-15 528 552)" />
    <!-- C -->
    <path d="M 569 566 C 555 558, 540 572, 541 592 C 542 610, 559 616, 574 603" stroke-width="10.5" />

    <!-- P (Plan) -->
    <path d="M 596 536 L 596 618" stroke-width="12" />
    <path d="M 578 532 C 603 522, 642 535, 642 561 C 642 586, 604 590, 582 579 C 574 574, 576 564, 588 564 L 614 564" stroke-width="11" />
    <!-- L -->
    <path d="M 652 558 C 650 578, 647 598, 646 613 C 656 611, 667 611, 676 613" stroke-width="10.5" />
    <!-- A -->
    <path d="M 686 614 C 695 584, 706 555, 716 555 C 724 555, 729 585, 733 614" stroke-width="10.5" />
    <path d="M 693 594 L 730 589" stroke-width="9.5" />
    <!-- N -->
    <path d="M 748 613 C 749 590, 752 566, 754 558 C 762 575, 771 596, 779 613 C 781 592, 785 570, 788 556" stroke-width="10.5" />
  </g>

  <!-- Subtitle: "DONDE BRILLA LA MAGIA" in Pink (#EC4689) -->
  <text
    x="400"
    y="708"
    text-anchor="middle"
    font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
    font-size="38"
    font-weight="600"
    letter-spacing="3.5"
