    <path d="M 192 559 C 209 551, 226 557, 225 572 C 224 584, 207 588, 197 588 C 208 592, 217 604, 224 614" stroke-width="10" />
    <!-- I -->
    <path d="M 244 572 L 241 612" stroke-width="10.5" />
    <ellipse cx="246" cy="552" rx="7.5" ry="5.5" fill="#233975" stroke="none" transform="rotate(-15 246 552)" />
    <!-- S -->
    <path d="M 284 565 C 273 558, 257 564, 258 575 C 259 586, 285 588, 284 602 C 283 615, 263 617, 254 606" stroke-width="10.5" />

